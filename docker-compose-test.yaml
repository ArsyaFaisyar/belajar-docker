services:
  test:
    build:
      context: .
      target: test
    command: sh -c "npm run db:init && npm test"
    environment:
      NODE_ENV: test
      PORT: 3060
      DB_HOST: test-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: bank_test_db
    depends_on:
      test-db:
        condition: service_healthy

  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank_test_db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d bank_test_db"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data