services:
  app:
    build: .

    container_name: docker-op

    ports:
      - "3060:3060"

    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bank-network

  db  :

      image : postgres:16-alpine

      container_name  : docker-op-db

      ports :
      - "5432:5432"

      environment:
        POSTGRES_USER : ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB : ${DB_NAME}

      volumes:
      - docker-op-db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

      healthcheck: 
        test: ["CMD-SHELL","pg_isready -U ${DB_USER} -d ${DB_NAME}"]
        interval: 5s
        timeout: 3s
        retries: 5
      networks:
       - bank-network

volumes:
   docker-op-db:

networks:
    bank-network:
  